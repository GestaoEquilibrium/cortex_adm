<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ponto · Grupo Equilibrium</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4' stroke='%231068B0' stroke-width='2.6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    :root{
      --marca:#1068B0; --marca-claro:#2893EB; --tint:#E7F2FB; --tint-borda:#C1DCF3;
      --ink:#1C2530; --sec:#5B6572; --muted:#8C97A4;
      --linha:#E7EDF3; --fundo:#F6F8FB; --campo:#FBFCFE;
      --verde:#16A34A; --verde-esc:#15803D; --vermelho:#DC2626; --vermelho-esc:#B91C1C;
      --mono:'JetBrains Mono',monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Outfit',sans-serif;background:var(--fundo);color:var(--ink);-webkit-font-smoothing:antialiased}
    input,select,button,textarea{font-family:inherit}
    input:focus,select:focus,textarea:focus{border-color:var(--marca)!important;box-shadow:0 0 0 3px rgba(16,104,176,.13);outline:none}
    button{transition:all .15s ease}button:hover{opacity:.9}button:active{transform:scale(.98)}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes toastIn{from{opacity:0;transform:translate(-50%,-16px)}to{opacity:1;transform:translate(-50%,0)}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
    ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
    @media (prefers-reduced-motion: reduce){*{animation:none!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
<div id="raiz"></div>
<noscript>O relógio de ponto precisa de JavaScript habilitado.</noscript>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;
const CFG = window.CORTEX_CFG || {};
const configOk = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && CFG.SUPABASE_URL.indexOf("COLE_AQUI") === -1);
const sb = configOk ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY) : null;

// ─── helpers ───
function minutos(hhmm){ const p = String(hhmm||"").split(":"); return (parseInt(p[0],10)||0)*60 + (parseInt(p[1],10)||0); }
function totalDoDia(batidas){
  let t = 0;
  for (let i = 0; i < batidas.length - 1; i++) {
    if (batidas[i].tipo === "entrada" && batidas[i+1].tipo === "saida") { t += minutos(batidas[i+1].hora) - minutos(batidas[i].hora); i++; }
  }
  return t;
}
function fmtMin(t){ const h = Math.floor(t/60), m = t%60; return h + "h " + String(m).padStart(2,"0") + "min"; }
function hojeISO(){ const n = new Date(); return n.getFullYear() + "-" + String(n.getMonth()+1).padStart(2,"0") + "-" + String(n.getDate()).padStart(2,"0"); }

// ─── estilos ───
const labelSt = {display:"block",fontSize:11,fontWeight:700,color:"var(--muted)",marginBottom:5,textTransform:"uppercase",letterSpacing:1};
const inputSt = {width:"100%",padding:"12px 14px",background:"var(--campo)",border:"1.5px solid var(--linha)",borderRadius:11,color:"var(--ink)",fontSize:15,outline:"none"};
const textareaSt = {...inputSt,minHeight:100,resize:"vertical"};
const btnAzul = {padding:"12px 24px",background:"linear-gradient(135deg,var(--marca),var(--marca-claro))",color:"#fff",border:"none",borderRadius:11,cursor:"pointer",fontSize:15,fontWeight:700,boxShadow:"0 4px 14px rgba(16,104,176,.25)"};
const btnGhost = {padding:"7px 14px",background:"var(--campo)",color:"var(--muted)",border:"1.5px solid var(--linha)",borderRadius:9,cursor:"pointer",fontSize:12,fontWeight:600};

// ─── componentes ───
function Marca(){
  const [semLogo, setSemLogo] = useState(false);
  return (
    <div style={{textAlign:"center",marginBottom:12}}>
      {!semLogo ? (
        <img src="logo.png" alt="Grupo Equilibrium" style={{maxWidth:220,maxHeight:96,objectFit:"contain"}} onError={()=>setSemLogo(true)} />
      ) : (
        <div style={{display:"inline-flex",alignItems:"center",gap:10}}>
          <svg width="34" height="34" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4" stroke="#1068B0" strokeWidth="2.6" strokeLinecap="round" fill="none"/></svg>
          <div style={{textAlign:"left",lineHeight:1.1}}>
            <div style={{fontSize:19,fontWeight:800,color:"var(--marca)"}}>Ponto Equilibrium</div>
            <div style={{fontSize:11,color:"var(--muted)",fontWeight:600,letterSpacing:2,textTransform:"uppercase"}}>CORTEX Gestão</div>
          </div>
        </div>
      )}
    </div>
  );
}

function Relogio(){
  const [agora, setAgora] = useState(new Date());
  useEffect(()=>{ const t = setInterval(()=>setAgora(new Date()), 1000); return ()=>clearInterval(t); },[]);
  return (
    <div style={{textAlign:"center",margin:"6px 0 18px"}}>
      <div style={{fontSize:56,fontWeight:800,fontFamily:"var(--mono)",color:"var(--marca)",letterSpacing:-3,lineHeight:1}}>
        {agora.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}
      </div>
      <div style={{fontSize:14,color:"var(--muted)",marginTop:6,fontWeight:500,textTransform:"capitalize"}}>
        {agora.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
      </div>
    </div>
  );
}

function Toast({msg,tipo,aoFechar}){
  useEffect(()=>{ const t = setTimeout(aoFechar, 3400); return ()=>clearTimeout(t); },[aoFechar]);
  const cores = {ok:"#16A34A",erro:"#DC2626",info:"#1068B0"};
  return (
    <div style={{position:"fixed",top:20,left:"50%",transform:"translateX(-50%)",zIndex:9999,background:cores[tipo]||cores.info,color:"#fff",padding:"13px 30px",borderRadius:12,fontSize:14,fontWeight:700,boxShadow:"0 8px 30px rgba(0,0,0,.18)",animation:"toastIn .3s ease",maxWidth:"92vw",textAlign:"center"}}>
      {msg}
    </div>
  );
}

function Modal({titulo,aoFechar,children}){
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(28,37,48,.42)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9998,padding:20}}
         onClick={(e)=>{ if (e.target === e.currentTarget) aoFechar(); }}>
      <div style={{background:"#fff",borderRadius:18,padding:"26px 28px",width:"100%",maxWidth:480,maxHeight:"90vh",overflowY:"auto",boxShadow:"0 20px 60px rgba(0,0,0,.16)",animation:"modalIn .25s ease",border:"1.5px solid var(--linha)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
          <h3 style={{margin:0,fontSize:18,fontWeight:800,color:"var(--ink)"}}>{titulo}</h3>
          <button onClick={aoFechar} style={{background:"none",border:"none",fontSize:22,cursor:"pointer",color:"var(--muted)",lineHeight:1}}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function TelaConfig(){
  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{maxWidth:460,background:"#fff",border:"1.5px solid var(--linha)",borderRadius:18,padding:"30px 32px",textAlign:"center"}}>
        <div style={{fontSize:34,marginBottom:10}}>⚙️</div>
        <div style={{fontSize:17,fontWeight:800,marginBottom:8}}>Falta configurar o sistema</div>
        <div style={{fontSize:14,color:"var(--sec)",lineHeight:1.6}}>O arquivo <b>config.js</b> ainda está sem a URL e a chave do Supabase. Preencha e recarregue esta página.</div>
      </div>
    </div>
  );
}

// ─── aplicativo ───
function App(){
  const [colabs, setColabs] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [selId, setSelId] = useState("");
  const [pin, setPin] = useState("");
  const [logado, setLogado] = useState(null);       // { colab, pin }
  const [batidas, setBatidas] = useState([]);        // [{tipo, hora}]
  const [ocupado, setOcupado] = useState(false);
  const [toast, setToast] = useState(null);
  const [occModal, setOccModal] = useState(null);    // { data, descricao }
  const pinRef = useRef(null);
  const avisar = (msg, tipo) => setToast({msg, tipo});

  // Lista de funcionários: carrega ao abrir, refaz a cada 5 min e ao voltar o foco.
  const carregar = useCallback(async () => {
    try {
      const { data, error } = await sb.rpc("relogio_colaboradores");
      if (error) throw error;
      setColabs(data || []);
      setCarregando(false);
    } catch (e) {
      setCarregando(false);
      avisar("Sem conexão com o banco. Tentando de novo...", "erro");
      setTimeout(carregar, 10000);
    }
  }, []);
  useEffect(() => {
    carregar();
    const t = setInterval(carregar, 300000);
    const aoFocar = () => carregar();
    window.addEventListener("focus", aoFocar);
    return () => { clearInterval(t); window.removeEventListener("focus", aoFocar); };
  }, [carregar]);

  // Foco automático na senha depois de escolher o nome.
  useEffect(() => { if (selId && pinRef.current) pinRef.current.focus(); }, [selId]);

  function sair(){ setLogado(null); setBatidas([]); setSelId(""); setPin(""); setOccModal(null); }

  async function acessar(){
    if (!selId) return avisar("Selecione um funcionário", "erro");
    if (!pin) return avisar("Digite a senha", "erro");
    setOcupado(true);
    try {
      const { data, error } = await sb.rpc("relogio_meu_dia", { p_colaborador: selId, p_pin: pin });
      if (error) throw error;
      if (!data.ok) { avisar(data.erro || "Senha incorreta!", "erro"); }
      else {
        const colab = colabs.find(c => c.id === selId) || { id: selId, nome: "" };
        setBatidas(data.batidas || []);
        setLogado({ colab, pin });
      }
    } catch (e) { avisar("Sem conexão. Tente de novo.", "erro"); }
    setOcupado(false);
  }

  async function bater(tipo){
    if (ocupado || !logado) return;
    const ultima = batidas[batidas.length - 1];
    if (tipo === "entrada" && ultima && ultima.tipo === "entrada") return avisar("Registre a saída primeiro!", "erro");
    if (tipo === "saida" && (!ultima || ultima.tipo === "saida")) return avisar("Registre a entrada primeiro!", "erro");
    setOcupado(true);
    try {
      const { data, error } = await sb.rpc("relogio_bater", { p_colaborador: logado.colab.id, p_pin: logado.pin, p_tipo: tipo });
      if (error) throw error;
      if (!data.ok) avisar(data.erro || "Não foi possível registrar.", "erro");
      else {
        avisar(tipo === "entrada" ? "✓ Entrada registrada às " + data.hora + "!" : "✓ Saída registrada às " + data.hora + "!", "ok");
        const dia = await sb.rpc("relogio_meu_dia", { p_colaborador: logado.colab.id, p_pin: logado.pin });
        if (!dia.error && dia.data.ok) setBatidas(dia.data.batidas || []);
      }
    } catch (e) { avisar("Sem conexão. A batida NÃO foi registrada.", "erro"); }
    setOcupado(false);
  }

  async function salvarOcorrencia(){
    if (!occModal || !logado) return;
    if (!occModal.descricao.trim()) return avisar("Descreva o motivo", "erro");
    setOcupado(true);
    try {
      const { data, error } = await sb.rpc("relogio_ocorrencia", { p_colaborador: logado.colab.id, p_pin: logado.pin, p_data: occModal.data, p_descricao: occModal.descricao });
      if (error) throw error;
      if (!data.ok) avisar(data.erro || "Não foi possível registrar.", "erro");
      else { avisar("✓ Ocorrência registrada!", "ok"); setOccModal(null); }
    } catch (e) { avisar("Sem conexão. Tente de novo.", "erro"); }
    setOcupado(false);
  }

  if (!configOk) return <TelaConfig/>;

  if (carregando) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{textAlign:"center"}}>
        <div style={{width:44,height:44,border:"4px solid var(--linha)",borderTopColor:"var(--marca)",borderRadius:"50%",animation:"spin 1s linear infinite",margin:"0 auto 18px"}}></div>
        <div style={{fontSize:15,color:"var(--sec)",fontWeight:600}}>Conectando...</div>
      </div>
    </div>
  );

  return (
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:20}}>
      {toast && <Toast msg={toast.msg} tipo={toast.tipo} aoFechar={()=>setToast(null)}/>}

      {occModal && (
        <Modal titulo="📝 Registrar Ocorrência" aoFechar={()=>setOccModal(null)}>
          <div style={{marginBottom:14}}>
            <div><label style={labelSt}>Data</label><input type="date" value={occModal.data} onChange={(e)=>setOccModal({...occModal,data:e.target.value})} style={inputSt}/></div>
            <div style={{marginTop:12}}><label style={labelSt}>Motivo / Descrição</label><textarea value={occModal.descricao} onChange={(e)=>setOccModal({...occModal,descricao:e.target.value})} placeholder="Ex.: esqueci de bater na volta do almoço..." style={textareaSt}/></div>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={salvarOcorrencia} disabled={ocupado} style={{...btnAzul,opacity:ocupado?.6:1}}>{ocupado?"Salvando...":"✓ Registrar"}</button>
            <button onClick={()=>setOccModal(null)} style={btnGhost}>Cancelar</button>
          </div>
        </Modal>
      )}

      <a href="./" style={{position:"fixed",top:14,right:14,...btnGhost,textDecoration:"none",fontSize:11,opacity:.55}}>⚙ Administração</a>

      <div style={{width:"100%",maxWidth:440,background:"#fff",borderRadius:22,padding:"36px 32px 30px",boxShadow:"0 2px 6px rgba(28,37,48,.05), 0 16px 44px rgba(28,37,48,.09)",border:"1.5px solid var(--linha)"}}>
        <Marca/>
        <Relogio/>

        {!logado ? (
          <div style={{animation:"fadeUp .4s ease"}}>
            <div style={{marginBottom:14}}>
              <label style={labelSt}>Funcionário</label>
              <select value={selId} onChange={(e)=>{setSelId(e.target.value);setPin("");}} style={{...inputSt,cursor:"pointer"}}>
                <option value="">Selecione seu nome...</option>
                {colabs.map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}
              </select>
            </div>
            <div style={{marginBottom:22}}>
              <label style={labelSt}>Senha</label>
              <input ref={pinRef} type="password" value={pin} onChange={(e)=>setPin(e.target.value)} onKeyDown={(e)=>{if(e.key==="Enter")acessar();}} placeholder="••••••" style={inputSt}/>
            </div>
            <button onClick={acessar} disabled={ocupado} style={{...btnAzul,width:"100%",padding:15,fontSize:16,opacity:ocupado?.7:1}}>{ocupado?"Verificando...":"Acessar"}</button>
          </div>
        ) : (
          <div style={{animation:"fadeUp .4s ease"}}>
            <div style={{textAlign:"center",padding:"6px 0 16px",borderBottom:"1.5px solid var(--linha)",marginBottom:20}}>
              <div style={{fontSize:12,color:"var(--muted)",marginBottom:2,fontWeight:600,textTransform:"uppercase",letterSpacing:1}}>Bem-vindo(a),</div>
              <div style={{fontSize:24,fontWeight:800,color:"var(--ink)"}}>{logado.colab.nome}</div>
              {logado.colab.cargo && <div style={{fontSize:13,color:"var(--muted)",marginTop:2}}>{logado.colab.cargo}</div>}
            </div>

            <div style={{display:"flex",gap:14,marginBottom:20}}>
              <button onClick={()=>bater("entrada")} disabled={ocupado} style={{flex:1,padding:"20px 8px",background:"linear-gradient(135deg,var(--verde),var(--verde-esc))",color:"#fff",border:"none",borderRadius:16,cursor:ocupado?"wait":"pointer",fontSize:15,fontWeight:800,opacity:ocupado?.6:1,boxShadow:"0 4px 16px rgba(22,163,74,.25)"}}>
                <span style={{fontSize:22,display:"block",marginBottom:4}}>▶</span>Entrada
              </button>
              <button onClick={()=>bater("saida")} disabled={ocupado} style={{flex:1,padding:"20px 8px",background:"linear-gradient(135deg,var(--vermelho),var(--vermelho-esc))",color:"#fff",border:"none",borderRadius:16,cursor:ocupado?"wait":"pointer",fontSize:15,fontWeight:800,opacity:ocupado?.6:1,boxShadow:"0 4px 16px rgba(220,38,38,.25)"}}>
                <span style={{fontSize:22,display:"block",marginBottom:4}}>■</span>Saída
              </button>
            </div>

            <button onClick={()=>setOccModal({data:hojeISO(),descricao:""})} disabled={ocupado} style={{width:"100%",padding:12,background:"#F59E0B",color:"#fff",border:"none",borderRadius:12,cursor:"pointer",fontSize:14,fontWeight:700,marginBottom:20,boxShadow:"0 2px 8px rgba(245,158,11,.25)"}}>
              📝 Registrar Ocorrência
            </button>

            {batidas.length > 0 && (
              <div style={{marginBottom:18}}>
                <div style={{fontSize:11,fontWeight:700,color:"var(--muted)",marginBottom:8,textTransform:"uppercase",letterSpacing:1}}>Registros de Hoje</div>
                <div style={{background:"var(--campo)",border:"1px solid var(--linha)",borderRadius:12,padding:10,maxHeight:160,overflowY:"auto"}}>
                  {batidas.map((b,i) => (
                    <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",borderRadius:8,marginBottom:3,background:b.tipo==="entrada"?"rgba(22,163,74,.07)":"rgba(220,38,38,.06)"}}>
                      <span style={{fontSize:12,fontWeight:700,color:b.tipo==="entrada"?"var(--verde)":"var(--vermelho)"}}>{b.tipo==="entrada"?"▶ Entrada":"■ Saída"}</span>
                      <span style={{fontSize:14,fontFamily:"var(--mono)",fontWeight:600,color:"var(--ink)"}}>{b.hora}</span>
                    </div>
                  ))}
                </div>
                <div style={{textAlign:"right",marginTop:10,fontSize:14,fontWeight:800,color:"var(--marca)"}}>Hoje: {fmtMin(totalDoDia(batidas))}</div>
              </div>
            )}

            <button onClick={sair} style={{width:"100%",padding:12,background:"transparent",border:"1.5px solid var(--linha)",color:"var(--muted)",borderRadius:10,cursor:"pointer",fontSize:13,fontWeight:600}}>← Sair</button>
          </div>
        )}
      </div>

      <div style={{marginTop:14,fontSize:11,color:"var(--muted)",opacity:.5}}>Ponto Equilibrium · CORTEX Gestão</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("raiz")).render(<App/>);
</script>
</body>
</html>
